name: Nightly Live

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  AVA_AUTH_REQUIRED: "1"
  AVA_WS_ALLOW_QUERY_TOKEN: "1"

jobs:
  reliability_stress:
    name: Reliability Stress
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ava_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ava_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ava_test
      AVA_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/ava_test
      JWT_SECRET: nightly-jwt-secret
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SLACK_SIGNING_SECRET: nightly-slack-signing-secret
      SLACK_BOT_TOKEN: xoxb-nightly-token
      AVA_FAIL_ON_SKIP: "1"
      AVA_OUTBOUND_DURABLE: "1"
      AVA_RELIABILITY_SEEDS: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push:ci
      - run: pnpm test:classification
      - run: pnpm test:reliability:quarantine
      - run: pnpm test:reliability:mock-guard
      - run: pnpm test:reliability:stress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-reliability-reports
          path: |
            reports/vitest-junit.xml
            reports/reliability-quarantine-summary.md

  live_tests:
    name: Live Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ava_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ava_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ava_test
      AVA_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/ava_test
      JWT_SECRET: nightly-jwt-secret
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      SLACK_SIGNING_SECRET: nightly-slack-signing-secret
      SLACK_BOT_TOKEN: xoxb-nightly-token
      AVA_LIVE_TESTS: "1"
      AVA_LIVE_TEST_ALLOW: ${{ secrets.AVA_LIVE_TEST_ALLOW || 'vertex,browser' }}
      AVA_LIVE_TIMEOUT_MS: "180000"
      VERTEX_AI_PROJECT_ID: ${{ secrets.VERTEX_AI_PROJECT_ID }}
      VERTEX_AI_SERVICE_ACCOUNT_KEY: ${{ secrets.VERTEX_AI_SERVICE_ACCOUNT_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      BROWSER_CDP_URL: ${{ secrets.BROWSER_CDP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push:ci
      - run: pnpm test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-reports
          path: reports/vitest-junit.xml

  docker_smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    env:
      CI: true
      AVA_LIVE_TESTS: ${{ secrets.AVA_LIVE_DOCKER_SMOKE || '0' }}
      AVA_TEST_DB_URL: postgresql://ava:ava_dev_password@127.0.0.1:5433/ava_dev
      VERTEX_AI_PROJECT_ID: ${{ secrets.VERTEX_AI_PROJECT_ID }}
      VERTEX_AI_SERVICE_ACCOUNT_KEY: ${{ secrets.VERTEX_AI_SERVICE_ACCOUNT_KEY }}
      JWT_SECRET: nightly-jwt-secret
      SLACK_SIGNING_SECRET: nightly-slack-signing-secret
      SLACK_BOT_TOKEN: xoxb-nightly-token
      CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docker:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke-log
          path: /tmp/ava-docker-smoke.log
